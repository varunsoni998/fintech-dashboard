<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#E8E8F2; --text:#3A3A5A; --muted:#9090A8; --accent:#6B7FD4; --green:#2FA37A; --warn:#C98A2B;
          --out:4px 4px 10px #C4C4D4,-4px -4px 10px #FFFFFF; --in:inset 3px 3px 7px #C4C4D4, inset -3px -3px 7px #FFFFFF; }
  * { box-sizing: border-box; }
  body { margin:0; width:340px; font:13px/1.4 Inter, Segoe UI, Arial, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { padding:14px; display:flex; flex-direction:column; gap:10px; }
  h1 { font-size:15px; margin:0; display:flex; align-items:center; gap:8px; }
  .logo { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,#7B8FE0,#5B6FD0); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .site { font-size:12px; color:var(--muted); }
  .card { border-radius:12px; box-shadow:var(--out); padding:10px; display:flex; flex-direction:column; gap:6px; }
  .cand { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:9px; cursor:pointer; }
  .cand:hover, .cand.sel { box-shadow:var(--in); }
  .cand .lbl { flex:1; color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cand .amt { font-weight:800; font-size:14px; }
  label.f { font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; display:flex; flex-direction:column; gap:4px; }
  input { background:var(--bg); box-shadow:var(--in); border:none; border-radius:10px; padding:8px 10px; font-size:14px; color:var(--text); outline:none; width:100%; font-weight:700; }
  button { border:none; border-radius:11px; padding:10px; font-weight:800; font-size:13.5px; cursor:pointer; color:#fff; background:linear-gradient(135deg,#7B8FE0,#5B6FD0); box-shadow:var(--out); }
  button:disabled { opacity:.5; cursor:default; }
  .msg { font-size:12px; font-weight:600; }
  .ok { color:var(--green); } .err { color:#D1435B; } .tip { color:var(--warn); font-size:11.5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="logo">₹</span> Grab price</h1>
  <div class="site" id="site">Reading this page…</div>
  <div class="card" id="cands"></div>
  <label class="f">Final total (₹, incl. taxes, all nights & rooms)<input id="total" inputmode="decimal" placeholder="e.g. 29913"></label>
  <label class="f">Hotel<input id="hotel" placeholder="Hotel name"></label>
  <div class="tip">Use the price on the <b>booking / checkout step</b> — not the search list.</div>
  <button id="send" disabled>Send to Price Compare</button>
  <div class="msg" id="msg"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
